[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
test = "test"
solc_version = "0.8.27"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"

[etherscan]
# Arc testnet block explorer; no verification API key required for testnet
arc_testnet = { key = "none", url = "https://testnet.arcscan.app/api" }
